name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint public code
        run: |
          python -m ruff check --select E9,F63,F7,F82 src/wenbo
          python -m ruff check examples/quickstart.py tests/test_quickstart.py

      - name: Run tests
        run: python -m pytest -q tests/test_quickstart.py

      - name: Run quickstart
        run: python examples/quickstart.py --output-file .local/ci/result.json
